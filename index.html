<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231E40AF'><path d='M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>E-Modul: Stop Bullying, Start Caring | MTs SA Riyadul Bayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      /* Immediate inline suppression of any Netlify drawer/badge before scripts load */
      [data-netlify-deploy-id], #netlify-drawer, .netlify-drawer, [id*="netlify"], [class*="netlify"], iframe[src*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
    <script>
      // Automatically eradicate any Netlify drawer / badge injected into DOM
      (function() {
        const removeNetlifyElements = function() {
          const targets = document.querySelectorAll(
            '#netlify-drawer, .netlify-drawer, [id*="netlify"], [class*="netlify"], iframe[src*="netlify"], iframe[title*="Netlify"], a[href*="netlify.com"]'
          );
          targets.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        };
        removeNetlifyElements();
        if (typeof MutationObserver !== 'undefined') {
          const observer = new MutationObserver(removeNetlifyElements);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-800 antialiased overflow-hidden select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
